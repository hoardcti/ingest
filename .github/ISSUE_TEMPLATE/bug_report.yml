name: Bug report
description: Something behaves incorrectly
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report.

        **If this is a security vulnerability, stop here.** Use the private
        reporting link on the "New issue" page, or follow `SECURITY.md` in the
        repository root — a public issue discloses the problem before a fix
        exists.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: This is not a security vulnerability
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The actual behaviour, including any error output.
      placeholder: Describe the incorrect behaviour.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal, reliable path to the problem.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "v1.2.3, or commit sha"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, runtime version, deployment method.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        Relevant output. This is rendered as code, so no backticks needed.
        Redact tokens, keys, hostnames, and any customer or victim data first.
      render: shell
    validations:
      required: false
