version: 2

updates:
  # Actions are pinned to commit SHAs for supply-chain safety, which means they
  # cannot drift on their own — and will never receive a security fix unless
  # something bumps them. Dependabot is that something. It understands the
  # `# vX.Y.Z` comment next to each SHA and keeps it accurate.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # The ingest service is Go. pgx and the AWS SDK are on the path of everything
  # this service does, so their fixes matter; grouping the minor and patch
  # updates keeps the pull request volume sane.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "deps"
    groups:
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # The runtime base image and the development stack's Postgres and Valkey.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps"

  # TEMPLATE: uncomment if this repository ever grows a Python or Node component.
  #
  # - package-ecosystem: "pip"        # or "uv", "poetry"
