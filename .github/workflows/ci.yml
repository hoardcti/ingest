name: CI

# Baseline checks every hoardCTI repository inherits. Add project-specific jobs
# (unit tests, type checks, build) alongside these — see CONTRIBUTING.md.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Detects which toolchains are present so language jobs can skip cleanly in
  # repositories that do not use them. A template serving several languages
  # cannot assume any one of them exists.
  detect:
    name: Detect toolchains
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      python: ${{ steps.detect.outputs.python }}
      python_manifest: ${{ steps.detect.outputs.python_manifest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Detect
        id: detect
        run: |
          if [ -n "$(git ls-files '*.py' | head -1)" ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi
          # pip-audit needs real declared dependencies to resolve. A pyproject.toml
          # carrying only tool configuration (as this template ships) has no
          # [project] table, and auditing it would fail trying to build a project
          # that does not exist — so check for actual dependency metadata.
          manifest=false
          if [ -n "$(git ls-files 'requirements*.txt' 'setup.py' | head -1)" ]; then
            manifest=true
          elif [ -f pyproject.toml ] && grep -q '^\[project\]' pyproject.toml; then
            manifest=true
          fi
          echo "python_manifest=$manifest" >> "$GITHUB_OUTPUT"

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Workflows are the bulk of this template, so they get linted like code.
      # Pinned by image digest for the same supply-chain reason as the actions.
      - name: Run actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        with:
          args: -color

  zizmor:
    name: Audit workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # actionlint checks that workflows are CORRECT; zizmor checks that they
      # are SAFE — template injection, credential persistence, dangerous
      # triggers, over-broad permissions. Deliberate exceptions live in
      # .github/zizmor.yml with written justifications.
      - name: Run zizmor
        run: |
          python -m pip install --quiet zizmor==1.30.0
          zizmor --config .github/zizmor.yml .github/workflows/

  dependency-review:
    name: Review dependency changes
    # Only meaningful on a pull request, where there is a base to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Blocks pull requests that introduce vulnerable dependencies. It also
      # gates on LICENCE, which matters here: this repository is GPL-3.0, and a
      # dependency on an incompatible licence is far cheaper to reject at review
      # time than to unpick after release.
      - name: Dependency review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          # TEMPLATE: licence policy is a legal decision, so nothing is denied by
          # default — enabling a wrong list blocks contributors for bad reasons.
          # Agree the policy, then uncomment. Note GPL-3.0 compatibility is
          # directional: Apache-2.0 code can be included in a GPL-3.0 work, but
          # not the reverse, and GPL-2.0-only is incompatible outright.
          #
          # deny-licenses: GPL-2.0-only, LGPL-2.0-only, AGPL-1.0-only
          #
          # Comment posting is left off: on a fork pull request the token is
          # read-only and the attempt fails. Findings appear in the job summary.
          comment-summary-in-pr: never

  python-lint:
    name: Lint Python
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --quiet ruff==0.16.5

      # Rules and per-file ignores are configured in pyproject.toml.
      - name: ruff check
        run: ruff check --output-format github .

      - name: ruff format
        run: ruff format --check --diff .

  python-audit:
    name: Audit Python dependencies
    needs: detect
    if: needs.detect.outputs.python_manifest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Scrapers pull in parsing libraries (lxml, BeautifulSoup, feedparser),
      # which is exactly where parser CVEs land. Dependabot alerts on the
      # manifest; pip-audit checks what actually resolves.
      - name: Run pip-audit
        run: |
          python -m pip install --quiet pip-audit==2.9.0
          if [ -f requirements.txt ]; then
            pip-audit --requirement requirements.txt --strict
          else
            pip-audit --strict
          fi

  scanner-tests:
    name: Secret scanner tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # The scanner is a security control. It ships with tests, and they run on
      # every change so a regression cannot silently disable detection.
      - name: Run unit tests
        run: python -m unittest discover -s .github/scripts -p "test_*.py" -v
