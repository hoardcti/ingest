name: CI

# Baseline checks every hoardCTI repository inherits. Add project-specific jobs
# (unit tests, type checks, build) alongside these — see CONTRIBUTING.md.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Detects which toolchains are present so language jobs can skip cleanly in
  # repositories that do not use them. A template serving several languages
  # cannot assume any one of them exists.
  detect:
    name: Detect toolchains
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      python: ${{ steps.detect.outputs.python }}
      python_manifest: ${{ steps.detect.outputs.python_manifest }}
      go: ${{ steps.detect.outputs.go }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Detect
        id: detect
        run: |
          if [ -n "$(git ls-files '*.py' | head -1)" ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi
          # A go.mod is what makes the Go jobs meaningful; stray .go files in a
          # docs directory are not a module.
          if [ -f go.mod ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
          # pip-audit needs real declared dependencies to resolve. A pyproject.toml
          # carrying only tool configuration (as this template ships) has no
          # [project] table, and auditing it would fail trying to build a project
          # that does not exist — so check for actual dependency metadata.
          manifest=false
          if [ -n "$(git ls-files 'requirements*.txt' 'setup.py' | head -1)" ]; then
            manifest=true
          elif [ -f pyproject.toml ] && grep -q '^\[project\]' pyproject.toml; then
            manifest=true
          fi
          echo "python_manifest=$manifest" >> "$GITHUB_OUTPUT"

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Workflows are the bulk of this template, so they get linted like code.
      # Pinned by image digest for the same supply-chain reason as the actions.
      - name: Run actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        with:
          args: -color

  zizmor:
    name: Audit workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # actionlint checks that workflows are CORRECT; zizmor checks that they
      # are SAFE — template injection, credential persistence, dangerous
      # triggers, over-broad permissions. Deliberate exceptions live in
      # .github/zizmor.yml with written justifications.
      - name: Run zizmor
        run: |
          python -m pip install --quiet zizmor==1.30.0
          zizmor --config .github/zizmor.yml .github/workflows/

  dependency-review:
    name: Review dependency changes
    # Only meaningful on a pull request, where there is a base to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Blocks pull requests that introduce vulnerable dependencies. It also
      # gates on LICENCE, which matters here: this repository is GPL-3.0, and a
      # dependency on an incompatible licence is far cheaper to reject at review
      # time than to unpick after release.
      - name: Dependency review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          # TEMPLATE: licence policy is a legal decision, so nothing is denied by
          # default — enabling a wrong list blocks contributors for bad reasons.
          # Agree the policy, then uncomment. Note GPL-3.0 compatibility is
          # directional: Apache-2.0 code can be included in a GPL-3.0 work, but
          # not the reverse, and GPL-2.0-only is incompatible outright.
          #
          # deny-licenses: GPL-2.0-only, LGPL-2.0-only, AGPL-1.0-only
          #
          # Comment posting is left off: on a fork pull request the token is
          # read-only and the attempt fails. Findings appear in the job summary.
          comment-summary-in-pr: never

  python-lint:
    name: Lint Python
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --quiet ruff==0.16.5

      # Rules and per-file ignores are configured in pyproject.toml.
      - name: ruff check
        run: ruff check --output-format github .

      - name: ruff format
        run: ruff format --check --diff .

  python-audit:
    name: Audit Python dependencies
    needs: detect
    if: needs.detect.outputs.python_manifest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Scrapers pull in parsing libraries (lxml, BeautifulSoup, feedparser),
      # which is exactly where parser CVEs land. Dependabot alerts on the
      # manifest; pip-audit checks what actually resolves.
      - name: Run pip-audit
        run: |
          python -m pip install --quiet pip-audit==2.9.0
          if [ -f requirements.txt ]; then
            pip-audit --requirement requirements.txt --strict
          else
            pip-audit --strict
          fi

  go-lint:
    name: Lint Go
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # A go.mod that does not match the imports means someone committed a
      # dependency change without the lockfile, and the next contributor's build
      # will differ from CI's.
      - name: go mod tidy is a no-op
        run: go mod tidy -diff

      - name: Build
        run: go build ./...

  go-test:
    name: Test Go
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    # The write path is almost entirely SQL — partitioning, ON CONFLICT merges,
    # COPY into a staging table — so it is tested against a real PostgreSQL.
    # A mock would only assert that the mock matches itself.
    #
    # Images pinned by digest for the same supply-chain reason as the actions.
    services:
      postgres:
        image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73 # 17-alpine
        env:
          POSTGRES_USER: hoardcti
          POSTGRES_PASSWORD: hoardcti
          POSTGRES_DB: hoardcti_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hoardcti -d hoardcti_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      valkey:
        image: valkey/valkey@sha256:4934d214fd7e091d4ee77b398945b3fd62c6dd0ac71d8b79e2e3cbad8364f3b1 # 8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true

      # The race detector matters more than usual here: the ingest runner fans
      # one queue reader out to a pool of workers sharing a connection pool, a
      # source cache and a partition cache.
      - name: Test
        env:
          HOARDCTI_TEST_DATABASE_URL: postgres://hoardcti:hoardcti@localhost:5432/hoardcti_test?sslmode=disable
          HOARDCTI_TEST_REDIS_URL: redis://localhost:6379/0
        run: go test -race -count=1 ./...

      # The examples are what collector authors copy from. If they drift out of
      # the contract, every new collector starts wrong.
      - name: Validate the example envelopes
        run: go run ./cmd/ingest validate contract/examples/*.json

  go-audit:
    name: Audit Go dependencies
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true

      # govulncheck reports only vulnerabilities in code paths this binary
      # actually reaches, so it produces far less noise than a manifest scanner
      # and what it does report is worth acting on.
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  scanner-tests:
    name: Secret scanner tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # The scanner is a security control. It ships with tests, and they run on
      # every change so a regression cannot silently disable detection.
      - name: Run unit tests
        run: python -m unittest discover -s .github/scripts -p "test_*.py" -v
