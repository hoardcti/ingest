name: Secret Scan

# Diff scanning on pull requests catches what a contribution adds. It does NOT
# cover anything merged before this check existed, or pushed straight to the
# default branch -- hence the scheduled and push-triggered full-tree scans.
#
# This is a safety net. The primary control is GitHub's native secret scanning
# with push protection, which blocks the push outright and validates candidates
# with the issuing provider. Enable it on every repository (see TEMPLATE.md).

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 04:17 UTC. Off-peak and off the hour to avoid the
    # scheduling stampede GitHub throttles.
    - cron: "17 4 * * 1"
  workflow_dispatch:

# Default to no privileges; each job opts in to exactly what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diff-scan:
    name: Scan pull request diff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history so the base...head merge base is reachable.
          fetch-depth: 0
          # Do not leave the job token in .git/config for later steps to reuse.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Scan added lines for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python .github/scripts/secret_scan.py --mode diff

  tree-scan:
    name: Scan full tree
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Scan every tracked file for secrets
        run: python .github/scripts/secret_scan.py --mode tree
