name: Ingest

# A reusable workflow wrapping the composite action, for collectors that want
# ingest as its own job rather than a step.
#
# The envelope arrives as an ARTIFACT, not a path. That is not a preference: a
# `workflow_call` job runs on its own runner with its own empty workspace and
# cannot see files a previous job wrote, so an artifact is the only mechanism
# that crosses the job boundary.
#
# If the collector produces the envelope and ingests it in one go — which is
# usually simpler and always faster — use the composite action directly instead
# and skip the upload/download round trip entirely:
#
#   - uses: hoardcti/ingest@v1
#     with:
#       envelope: out/*.json
#       endpoint: https://ingest.example.org
#       token: ${{ secrets.HOARDCTI_INGEST_TOKEN }}

on:
  workflow_call:
    inputs:
      artifact:
        description: "Name of the artifact holding the envelope JSON files."
        required: true
        type: string

      envelope:
        description: >-
          Glob for the envelopes inside the downloaded artifact. One pattern per
          line for several.
        required: false
        type: string
        default: "*.json"

      mode:
        description: "submit (default), direct, or validate. See the action's inputs."
        required: false
        type: string
        default: submit

      endpoint:
        description: "Base URL of the ingest service. Required for mode=submit."
        required: false
        type: string
        default: ""

      runs-on:
        description: "Runner label. Set this to reach a database or service that is not on the public internet."
        required: false
        type: string
        default: ubuntu-latest

      fail-on-dropped:
        description: "Fail if any record was dropped during canonicalisation."
        required: false
        type: boolean
        default: false

      fail-on-duplicate:
        description: "Fail if every envelope had already been ingested."
        required: false
        type: boolean
        default: false

      archive-backend:
        description: "Raw payload archive for mode=direct: none, s3 or fs."
        required: false
        type: string
        default: "none"

      archive-bucket:
        description: "Bucket for archive-backend=s3."
        required: false
        type: string
        default: ""

      archive-endpoint:
        description: "S3 API endpoint for archive-backend=s3."
        required: false
        type: string
        default: ""

    secrets:
      token:
        description: "Bearer token for the submission endpoint. Required for mode=submit."
        required: false
      database-url:
        description: "Postgres connection string. Required for mode=direct."
        required: false
      archive-access-key-id:
        required: false
      archive-secret-access-key:
        required: false

    outputs:
      envelopes:
        description: "Number of envelope files processed."
        value: ${{ jobs.ingest.outputs.envelopes }}
      accepted:
        description: "Envelopes accepted."
        value: ${{ jobs.ingest.outputs.accepted }}
      duplicates:
        description: "Envelopes already ingested."
        value: ${{ jobs.ingest.outputs.duplicates }}
      records:
        description: "Records written (mode=direct only)."
        value: ${{ jobs.ingest.outputs.records }}
      sightings:
        description: "Sightings appended (mode=direct only)."
        value: ${{ jobs.ingest.outputs.sightings }}
      dropped:
        description: "Records dropped during canonicalisation (mode=direct only)."
        value: ${{ jobs.ingest.outputs.dropped }}
      result:
        description: "Per-envelope results as a JSON array."
        value: ${{ jobs.ingest.outputs.result }}

permissions: {}

jobs:
  ingest:
    name: Ingest envelopes
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      envelopes: ${{ steps.ingest.outputs.envelopes }}
      accepted: ${{ steps.ingest.outputs.accepted }}
      duplicates: ${{ steps.ingest.outputs.duplicates }}
      records: ${{ steps.ingest.outputs.records }}
      sightings: ${{ steps.ingest.outputs.sightings }}
      dropped: ${{ steps.ingest.outputs.dropped }}
      result: ${{ steps.ingest.outputs.result }}

    steps:
      # github.workflow_ref looks like
      #   hoardcti/ingest/.github/workflows/ingest.yml@refs/heads/main
      # so the part after the last @ is the ref the caller pinned. Checking the
      # action out at that same ref means `uses: ./…` below cannot drift away
      # from the workflow the caller actually asked for.
      - name: Resolve the ingest ref
        id: ref
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          ref="${WORKFLOW_REF##*@}"
          if [ -z "$ref" ] || [ "$ref" = "$WORKFLOW_REF" ]; then
            echo "::error::could not parse a ref out of '$WORKFLOW_REF'"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Using hoardcti/ingest at $ref"

      - name: Check out the ingest action
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: hoardcti/ingest
          ref: ${{ steps.ref.outputs.ref }}
          path: .hoardcti-ingest
          persist-credentials: false

      - name: Download the envelopes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact }}
          path: .hoardcti-envelopes

      - name: List what arrived and resolve the patterns
        id: patterns
        env:
          ARTIFACT: ${{ inputs.artifact }}
          ENVELOPE: ${{ inputs.envelope }}
        run: |
          set -euo pipefail
          echo "Artifact '$ARTIFACT' contains:"
          find .hoardcti-envelopes -type f -exec ls -l {} +

          # The artifact was unpacked into .hoardcti-envelopes, so every pattern
          # needs that prefix. Done per line rather than with format() in the
          # `with:` block below, because format() would only prefix the first
          # line of a multi-line glob and silently leave the rest pointing at
          # the workspace root.
          {
            echo "patterns<<HOARDCTI_PATTERNS_EOF"
            printf '%s\n' "$ENVELOPE" | while IFS= read -r p; do
              trimmed="$(printf '%s' "$p" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
              [ -n "$trimmed" ] || continue
              echo ".hoardcti-envelopes/$trimmed"
            done
            echo "HOARDCTI_PATTERNS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Ingest
        id: ingest
        uses: ./.hoardcti-ingest
        with:
          envelope: ${{ steps.patterns.outputs.patterns }}
          mode: ${{ inputs.mode }}
          endpoint: ${{ inputs.endpoint }}
          token: ${{ secrets.token }}
          database-url: ${{ secrets.database-url }}
          fail-on-dropped: ${{ inputs.fail-on-dropped }}
          fail-on-duplicate: ${{ inputs.fail-on-duplicate }}
          archive-backend: ${{ inputs.archive-backend }}
          archive-bucket: ${{ inputs.archive-bucket }}
          archive-endpoint: ${{ inputs.archive-endpoint }}
          archive-access-key-id: ${{ secrets.archive-access-key-id }}
          archive-secret-access-key: ${{ secrets.archive-secret-access-key }}
