# zizmor configuration — https://docs.zizmor.sh/configuration/
#
# zizmor audits GitHub Actions workflows for SECURITY problems (template
# injection, credential persistence, dangerous triggers). That is a different
# job from actionlint, which checks correctness; both run in CI.
#
# Suppressions below are deliberate and justified. Do not add one without a
# comment explaining why the finding is not exploitable here — an unexplained
# suppression is how a real issue gets buried.

rules:
  dangerous-triggers:
    ignore:
      # pr-size-check.yml uses `pull_request_target` on purpose: under
      # `pull_request`, fork PRs get a read-only token and every labelling and
      # commenting call fails with 403 — which is the normal contribution path
      # on an open-source repository.
      #
      # The trigger is safe here ONLY because the workflow never checks out,
      # builds, or executes pull request code; it reads PR metadata through the
      # API and nothing else. If a checkout step is ever added to that
      # workflow, this suppression must be removed and the design revisited.
      - pr-size-check.yml

  self-repository:
    ignore:
      # zizmor prefers `uses: $/…` over `uses: ./…`, and it is right about the
      # principle: the workspace-relative form resolves against runtime
      # filesystem state, so it could in theory load an action cloned by an
      # earlier step. Two reasons it stays as it is for now.
      #
      # First, `$/` does not appear anywhere in GitHub's published workflow
      # syntax reference. This action is the integration point every collector
      # repository will depend on, and adopting an undocumented form there
      # would break all of them at once if it is not universally available.
      # Revisit when GitHub documents it — the change is one line per site.
      #
      # Second, neither use is the hazard the audit describes:
      #
      # ci.yml resolves `./` against this repository's own checkout, made by
      # actions/checkout in the same job. There is no untrusted clone.
      #
      # ingest.yml is the reusable workflow, and its `./.hoardcti-ingest` does
      # point at a runtime clone — but at a pinned one. The checkout names
      # `repository: hoardcti/ingest` literally, and the ref comes from
      # github.workflow_ref, which GitHub sets to this workflow's own ref. A
      # caller chooses which version of the workflow to call and nothing else;
      # it cannot redirect the checkout at another repository or ref.
      - ci.yml
      - ingest.yml

  artipacked:
    ignore:
      # template-cleanup.yml must keep the checkout credentials: it pushes the
      # personalisation commit back to the default branch. It runs once, only in
      # repositories generated from this template, and deletes itself afterwards.
      # It also uploads no artifacts, so there is nothing for the persisted
      # credential to leak into.
      - template-cleanup.yml
